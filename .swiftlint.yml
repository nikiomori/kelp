included: [Sources, Tests]
excluded: [.build]
disabled_rules:
  - identifier_name
  - large_tuple
  - nesting
  - opening_brace
  - statement_position
  - multiple_closures_with_trailing_closure
  - todo
  - optional_data_string_conversion   # String(decoding:as:) is the lossless form; the suggested String(bytes:encoding:) returns an optional
  - closure_parameter_position   # swift-format (the formatter, .swift-format) puts a long closure's parameters on its next line
opt_in_rules:
  - force_unwrapping
force_unwrapping:
  severity: warning

# Limits, not style: a line, a function, a type or a file past these is one to split. (A command dispatcher's `switch`
# counts as one decision.) Lines are wrapped at 120 by swift-format since 2026-11-08, so the line counts below are a
# third over what they were at 160 for the same code.
line_length:
  warning: 180
  error: 300
  ignores_comments: true
  ignores_urls: true
  excluded_lines_patterns: ['"[^"]{100,}"', '#".{100,}"#', "'[^']{100,}'"]   # one long string (UI text, JSON, a script) reads worse cut up
function_body_length:
  warning: 105
  error: 200
cyclomatic_complexity:
  warning: 20
  error: 40
  ignores_case_statements: true
type_body_length:
  warning: 530
  error: 800
file_length:
  warning: 660
  error: 1300
  ignore_comment_only_lines: true
