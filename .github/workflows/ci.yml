name: CI
on:
  pull_request:
    paths-ignore: [README.md, CONTRIBUTING.md, SECURITY.md, 'docs/**']
  push:
    branches: [main]
    paths-ignore: [README.md, CONTRIBUTING.md, SECURITY.md, 'docs/**']
concurrency:   # a newer push to the same branch cancels the run it makes stale
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # Xcode 26's SwiftPM skips asset catalogs (a dependency's Bundle.module goes missing) unless it builds with
  # Swift Build, the default from Xcode 27 on; drop the flag once runners have Xcode 27.
  XCODE: '26.6'
  SWIFT_BUILD: --build-system swiftbuild
jobs:
  # libghostty takes ~12 min to build: once per build-ghostty.sh (it pins GHOSTTY_COMMIT), cached for the jobs below.
  ghostty:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache/restore@v4
        with: { path: Vendor/GhosttyKit.xcframework, key: "ghostty-${{ hashFiles('scripts/build-ghostty.sh') }}", lookup-only: true }
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo xcode-select -s /Applications/Xcode_$XCODE.app && scripts/build-ghostty.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: Vendor/GhosttyKit.xcframework, key: "ghostty-${{ hashFiles('scripts/build-ghostty.sh') }}" }
  test:
    needs: ghostty
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build and test
            build: swift build $SWIFT_BUILD
            test: swift test $SWIFT_BUILD
          - name: Daemon under Thread Sanitizer
            build: swift build $SWIFT_BUILD --product kelp && swift build $SWIFT_BUILD --product kelpd   # the PTY tests run them
            test: swift test $SWIFT_BUILD --sanitize=thread --scratch-path .build/tsan --filter DaemonTests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_$XCODE.app
      - uses: actions/cache/restore@v4
        with: { path: Vendor/GhosttyKit.xcframework, key: "ghostty-${{ hashFiles('scripts/build-ghostty.sh') }}", fail-on-cache-miss: true }
      - name: Cache dependencies   # sources only: build products run to GBs and would crowd out libghostty
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
          key: spm-${{ hashFiles('Package.resolved') }}
      - run: ${{ matrix.build }}
      - name: Link .build/debug   # Xcode 27's Swift Build makes it (the tests find kelp there); Xcode 26's doesn't
        run: '[ -e .build/debug ] || ln -s out/Products/Debug .build/debug'
      - run: ${{ matrix.test }}
      - name: Show the build layout
        if: failure()
        run: |
          ls -la .build .build/out/Products/Debug | head -60
          find .build -maxdepth 6 -name Sparkle.framework -not -path '*/checkouts/*' -not -path '*/artifacts/*'
          for b in .build/out/Products/Debug/KelpAppTests.xctest .build/tsan/out/Products/Debug/KelpAppTests.xctest; do
            [ -d "$b" ] && otool -l "$b/Contents/MacOS/KelpAppTests" | grep -A2 LC_RPATH | grep path
          done || true
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint && swiftlint --quiet
