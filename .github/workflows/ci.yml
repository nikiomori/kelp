name: CI
on:
  pull_request:
    paths-ignore: [README.md, CONTRIBUTING.md, SECURITY.md, 'docs/**']
  push:
    branches: [main]
    paths-ignore: [README.md, CONTRIBUTING.md, SECURITY.md, 'docs/**']
concurrency:   # a newer push to the same branch cancels the run it makes stale
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  XCODE: '27.2'
  # Every test at once (each with its daemons, PTYs and git) starves a 3-core runner into timeouts.
  SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: 6
  # A restored .build counts as built: Swift Build compares a file's size and time, not the inode a fresh disk changes.
  IgnoreFileSystemDeviceInodeChanges: 1
jobs:
  test:
    name: ${{ matrix.name }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build and test
            cache: tests
            # Built by the test run itself: each `swift` start loads the package again, and each build copies the Swift
            # libraries into every test bundle and signs them, nothing compiled or not: 40 s for a second one.
            build: "true"
            # One at a time: the app's tests share one main thread, and side by side their waits ran out on a busy one
            test: swift test --manifest-cache local --no-parallel --skip DaemonTests   # those: the job below
          - name: Release build
            cache: release
            # What `make release` compiles: code a debug build leaves out (#if DEBUG) or puts in only there is checked too.
            # No dSYMs, as bundle.sh: dsymutil warns of every CodeEditLanguages object (its debug map is its maker's Mac).
            build: swift build --manifest-cache local -c release -debug-info-format none
            test: "true"
          - name: Daemon under Thread Sanitizer
            cache: tsan
            # Only what DaemonTests needs, sanitized: kelp and kelpd too (the PTY tests run them), not the app.
            # tmux (Kelp's tmux terminals, a pane's caller: those tests skip without it) installs while the build runs.
            build: |
              (command -v tmux || brew install tmux) & tmux=$!
              for p in DaemonTests kelp kelpd; do swift build --manifest-cache local --sanitize=thread --product $p; done
              wait $tmux
            # `swift test --skip-build` wants every test bundle built, so its helper runs this one as swift test would.
            # Limit: the helper is SwiftPM's own, not an interface; if it moves, use `swift test --sanitize=thread`.
            test: |
              X=$(xcode-select -p); T=$X/Toolchains/XcodeDefault.xctoolchain/usr; P=$X/Platforms/MacOSX.platform/Developer
              B=.build/debug/DaemonTests.xctest/Contents/MacOS/DaemonTests
              env KELP_TEST_SLOW=4 DYLD_INSERT_LIBRARIES=$(ls $T/lib/clang/*/lib/darwin/libclang_rt.tsan_osx_dynamic.dylib | head -1) \
                DYLD_FRAMEWORK_PATH=$P/Library/Frameworks DYLD_LIBRARY_PATH=$P/usr/lib \
                $T/libexec/swift/pm/swiftpm-testing-helper --test-bundle-path $B --build-system swiftbuild $B --testing-library swift-testing
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode_$XCODE.app
      # SwiftPM keys its manifest cache by the whole environment, and a runner's differs in every step (GITHUB_SHA, the
      # step's own files): every `swift` compiled each package's manifest again, 12 s on three cores. This one is the same,
      # so a variable a build or a test run needs is named here: nothing else of the workflow's reaches them.
      - name: swift with the same environment every time
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/swift" <<EOF
          #!/bin/sh
          exec env -i HOME="$HOME" USER="$USER" SHELL="$SHELL" TMPDIR="$TMPDIR" PATH="$PATH" \\
            IgnoreFileSystemDeviceInodeChanges=$IgnoreFileSystemDeviceInodeChanges \\
            SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=$SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH /usr/bin/swift "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/swift"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # libghostty takes ~12 min to build: once per build-ghostty.sh (it pins GHOSTTY_COMMIT).
      - id: ghostty
        uses: actions/cache/restore@v6
        with: { path: Vendor/GhosttyKit.xcframework, key: "ghostty-${{ hashFiles('scripts/build-ghostty.sh', 'scripts/ghostty-patches/**') }}" }
      - if: steps.ghostty.outputs.cache-hit != 'true'
        run: scripts/build-ghostty.sh
      - if: steps.ghostty.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with: { path: Vendor/GhosttyKit.xcframework, key: "ghostty-${{ hashFiles('scripts/build-ghostty.sh', 'scripts/ghostty-patches/**') }}" }
      - uses: actions/cache/restore@v6
        with:
          path: .build
          key: build-${{ env.XCODE }}-${{ matrix.cache }}-${{ github.sha }}
          restore-keys: build-${{ env.XCODE }}-${{ matrix.cache }}-
      - name: Date sources by their contents   # a checkout dates them all now, and .build would rebuild everything
        run: git ls-files -sz | perl -0ne 'chomp; ($m,$b,$s,$f)=/^(\S+) (\S+) (\S+)\t(.*)$/s; next if $m eq "120000"; $t=1e9+hex(substr($b,0,7)); utime($t,$t,$f)'
      - id: build
        name: Build
        run: ${{ matrix.build }}
      - name: Test
        run: ${{ matrix.test }}
      # The app itself, on a few scenes (start page, Settings, a file, a terminal that ran a command), as pictures.
      - name: UI smoke
        if: matrix.cache == 'tests'
        run: scripts/ui-smoke.sh ui-smoke
      - if: always() && matrix.cache == 'tests'
        uses: actions/upload-artifact@v7
        with: { name: ui-smoke, path: ui-smoke, if-no-files-found: ignore }
      # Saved even when a test failed, for the next push to build on. repositories is 3.5 GB of clones nothing reads again.
      - if: always() && steps.build.outcome == 'success' && github.event_name == 'push'
        run: rm -rf .build/repositories
      - if: always() && steps.build.outcome == 'success' && github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: build-${{ env.XCODE }}-${{ matrix.cache }}-${{ github.sha }}
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: brew install swiftlint && swiftlint --quiet
