name: CI
on:
  pull_request:
    paths-ignore: [README.md, CONTRIBUTING.md, SECURITY.md, 'docs/**']
  push:
    branches: [main]
    paths-ignore: [README.md, CONTRIBUTING.md, SECURITY.md, 'docs/**']
concurrency:   # a newer push to the same branch cancels the run it makes stale
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # Xcode 26's SwiftPM skips asset catalogs (a dependency's Bundle.module goes missing) unless it builds with
  # Swift Build, the default from Xcode 27 on; its test bundles also lack the rpath to Sparkle.framework beside them.
  # Drop both once runners have Xcode 27.
  XCODE: '26.6'
  SWIFT_BUILD: --build-system swiftbuild -Xlinker -rpath -Xlinker @loader_path/../../..
  # Every test at once (each with its daemons, PTYs and git) starves a 3-core runner into timeouts.
  SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: 6
jobs:
  # libghostty takes ~12 min to build: once per build-ghostty.sh (it pins GHOSTTY_COMMIT), cached for the jobs below.
  ghostty:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache/restore@v4
        with: { path: Vendor/GhosttyKit.xcframework, key: "ghostty-${{ hashFiles('scripts/build-ghostty.sh') }}", lookup-only: true }
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo xcode-select -s /Applications/Xcode_$XCODE.app && scripts/build-ghostty.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: Vendor/GhosttyKit.xcframework, key: "ghostty-${{ hashFiles('scripts/build-ghostty.sh') }}" }
  test:
    needs: ghostty
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build and test
            # One compile: `swift build` then `swift test` built every module twice (tests need -enable-testing).
            build: swift build $SWIFT_BUILD --build-tests
            test: swift test $SWIFT_BUILD --skip-build
          - name: Daemon under Thread Sanitizer
            # Only what DaemonTests needs, sanitized: kelp and kelpd too (the PTY tests run them), not the app.
            build: for p in DaemonTests kelp kelpd; do swift build $SWIFT_BUILD --sanitize=thread --product $p; done
            # `swift test --skip-build` wants every test bundle built, so its helper runs this one as swift test would.
            # Limit: the helper is SwiftPM's own, not an interface; if it moves, use `swift test --sanitize=thread`.
            test: |
              X=$(xcode-select -p); T=$X/Toolchains/XcodeDefault.xctoolchain/usr; P=$X/Platforms/MacOSX.platform/Developer
              B=.build/debug/DaemonTests.xctest/Contents/MacOS/DaemonTests
              DYLD_INSERT_LIBRARIES=$(ls $T/lib/clang/*/lib/darwin/libclang_rt.tsan_osx_dynamic.dylib) \
                DYLD_FRAMEWORK_PATH=$P/Library/Frameworks DYLD_LIBRARY_PATH=$P/usr/lib \
                $T/libexec/swift/pm/swiftpm-testing-helper --test-bundle-path $B --build-system swiftbuild $B --testing-library swift-testing
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_$XCODE.app
      - uses: actions/cache/restore@v4
        with: { path: Vendor/GhosttyKit.xcframework, key: "ghostty-${{ hashFiles('scripts/build-ghostty.sh') }}", fail-on-cache-miss: true }
      - run: ${{ matrix.build }}
      - name: Link .build/debug   # Xcode 27's Swift Build makes it (the tests find kelp there); Xcode 26's doesn't
        run: '[ -e .build/debug ] || ln -s out/Products/Debug .build/debug'
      - run: ${{ matrix.test }}
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint && swiftlint --quiet
